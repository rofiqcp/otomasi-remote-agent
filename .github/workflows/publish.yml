name: Publish signed Otomasi Remote to npm

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Optional version expected in the signed release channel'
        required: false
        type: string
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-otomasi-remote-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure GitHub-hosted Node and npm
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install native OIDC-aware npm
        run: npm install -g npm@latest
      - name: Fetch and verify release signed on Otomasi server
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version || '' }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const key = 'MCowBQYDK2VwAyEAjxRQfj2CUQDdSsYy47Nr8DHHPnBiU0H+t1JJ8xG/y0g=';
          const base = 'https://mcp.otomasi.app';
          async function bytes(url, max) {
            const u = new URL(url);
            if (u.origin !== base || u.protocol !== 'https:') throw Error('Unexpected release URL');
            const r = await fetch(u, {redirect:'error', cache:'no-store',signal:AbortSignal.timeout(15000)});
            if (!r.ok) throw Error('Fetch HTTP '+r.status);
            const count = Number(r.headers.get('content-length')||0);
            if (count > max) throw Error('Release too large');
            const parts=[];let total=0;
            for await (const part of r.body) {
              total+=part.byteLength; if(total>max) throw Error('Release exceeded limit');
              parts.push(part);
            }
            return Buffer.concat(parts,total);
          }
          (async()=>{
            const data=JSON.parse((await bytes(base+'/downloads/agent-channel.json',8192)).toString());
            if(data.algorithm!=='ed25519'||typeof data.signature!=='string') throw Error('Invalid manifest');
            const m=data.release;
            if(!m||!/^\d+\.\d+\.\d+$/.test(m.version)|| !/^[a-f0-9]{64}$/.test(m.sha256)) throw Error('Invalid release');
            if(process.env.EXPECTED_VERSION && process.env.EXPECTED_VERSION!==m.version) throw Error('Requested version is not signed channel version');
            if(m.url!==base+'/downloads/otomasi-remote-'+m.version+'.tgz') throw Error('Unexpected tarball URL');
            const pub=crypto.createPublicKey({key:Buffer.from(key,'base64'),format:'der',type:'spki'});
            if(!crypto.verify(null,Buffer.from(JSON.stringify(m)),pub,Buffer.from(data.signature,'base64'))) throw Error('Invalid release signature');
            const tarball=await bytes(m.url,1024*1024);
            if(crypto.createHash('sha256').update(tarball).digest('hex')!==m.sha256) throw Error('SHA256 mismatch');
            fs.writeFileSync('release.tgz',tarball,{mode:0o600});
            const p=cp.execFileSync('tar',['-xOf','release.tgz','package/package.json'],{encoding:'utf8',timeout:10000,maxBuffer:50000});
            const pkg=JSON.parse(p);
            if(pkg.name!=='@otomasi/remote'||pkg.version!==m.version) throw Error('Incorrect npm package identity');
            fs.appendFileSync(process.env.GITHUB_ENV, 'RELEASE_VERSION='+m.version+'\n');
            console.log('Signed @otomasi/remote@'+m.version+' verified and ready for OIDC publishing');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - name: Publish only if the version is not already available
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@otomasi/remote@${RELEASE_VERSION}" version --fetch-retries=0 >/dev/null 2>&1; then
            echo "Immutable version ${RELEASE_VERSION} already published; nothing to do"
            exit 0
          fi
          # The trusted-publisher relationship provides short-lived OIDC authorization.
          # No OTP, NPM_TOKEN or long-lived secret is stored in GitHub.
          NPM_CONFIG_PROVENANCE=false npm publish release.tgz --access public
